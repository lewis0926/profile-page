---
apiVersion: v1
kind: Namespace
metadata:
  name: profile-page

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-page
  namespace: profile-page
  labels:
    app: profile-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-page
  template:
    metadata:
      labels:
        app: profile-page
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: profile-page
  namespace: profile-page
spec:
  selector:
    app: profile-page
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profile-page
  namespace: profile-page
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
    - hosts:
        - ${INGRESS_HOST}
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: profile-page
                port:
                  number: 80
